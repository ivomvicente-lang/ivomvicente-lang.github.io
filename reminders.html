<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <title>Payment Reminders — Albufeira Coworking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6f0;
      --paper: #f3ece1;
      --brown: #5c4033;
      --dark-brown: #3a2618;
      --terracotta: #c75b39;
      --olive: #6b7c4e;
      --burnt: #b85c38;
      --gold: #c9a96e;
      --ink: #2c1810;
      --muted: #8a7565;
      --line: #d4c5b2;
      --red: #b8382a;
      --green: #5a7c3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Lora", Georgia, serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(199, 91, 57, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(107, 124, 78, 0.03) 0%, transparent 50%);
    }

    /* ── Login Gate ── */
    .login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }

    .login-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(44, 24, 16, 0.08);
    }

    .login-card .stamp {
      display: inline-block;
      border: 3px solid var(--terracotta);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      line-height: 80px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 0.55rem;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transform: rotate(-12deg);
      margin-bottom: 1.25rem;
      position: relative;
    }

    .login-card .stamp::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid var(--terracotta);
      border-radius: 50%;
      opacity: 0.4;
    }

    .login-card h2 {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--dark-brown);
      margin-bottom: 0.3rem;
    }

    .login-card .subtitle {
      font-style: italic;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .login-input {
      width: 100%;
      padding: 0.8rem 1rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.6);
      color: var(--ink);
      text-align: center;
      letter-spacing: 0.15em;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus {
      border-color: var(--terracotta);
    }

    .login-input.error {
      border-color: var(--red);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .login-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 1rem;
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(199, 91, 57, 0.25);
      transition: transform 0.12s, box-shadow 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(199, 91, 57, 0.35);
    }

    .login-error {
      color: var(--red);
      font-size: 0.82rem;
      margin-top: 0.75rem;
      font-style: italic;
      min-height: 1.2em;
    }

    .lock-icon {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    /* ── Dashboard ── */
    .dashboard { display: none; }

    .container { max-width: 720px; margin: 0 auto; }

    header {
      text-align: center;
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--line);
      margin-bottom: 2rem;
    }

    .stamp {
      display: inline-block;
      border: 3px solid var(--terracotta);
      border-radius: 50%;
      width: 90px;
      height: 90px;
      line-height: 90px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 0.65rem;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transform: rotate(-12deg);
      margin-bottom: 1rem;
      position: relative;
    }

    .stamp::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid var(--terracotta);
      border-radius: 50%;
      opacity: 0.4;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: var(--dark-brown);
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    h1 em {
      font-style: italic;
      color: var(--terracotta);
    }

    .tagline {
      font-family: "Lora", serif;
      font-style: italic;
      color: var(--muted);
      font-size: 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .date-today {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .btn-lock {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-lock:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }

    .alert-box {
      background: rgba(184, 56, 42, 0.08);
      border: 1px solid var(--red);
      border-radius: 6px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }

    .alert-box.show { display: block; }

    .alert-box h2 {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .alert-box p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.25rem;
    }

    .clients { display: flex; flex-direction: column; gap: 1.75rem; }

    .client {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.75rem;
      position: relative;
    }

    .client::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 2rem;
      right: 2rem;
      height: 3px;
      background: var(--terracotta);
      border-radius: 0 0 3px 3px;
    }

    .client.urgent::before { background: var(--red); }
    .client.soon::before { background: var(--gold); }
    .client.safe::before { background: var(--green); }

    .client-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .client-name {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--dark-brown);
    }

    .client-since {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-top: 0.2rem;
    }

    .badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-ok { background: rgba(90, 124, 62, 0.12); color: var(--green); border: 1px solid var(--green); }
    .badge-soon { background: rgba(201, 169, 110, 0.15); color: #8a6d2b; border: 1px solid var(--gold); }
    .badge-urgent { background: rgba(184, 56, 42, 0.1); color: var(--red); border: 1px solid var(--red); }

    .countdown {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .countdown.ok { color: var(--green); }
    .countdown.soon { color: #8a6d2b; }
    .countdown.urgent { color: var(--red); }

    .countdown-label {
      font-family: "Lora", serif;
      font-style: italic;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .renewal-date {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      padding: 0.6rem 0.8rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      border-left: 3px solid var(--gold);
    }

    .renewal-date strong { color: var(--ink); }

    .btn {
      display: inline-block;
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.7rem 1.4rem;
      border-radius: 4px;
      transition: transform 0.12s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-terracotta {
      background: var(--terracotta);
      color: #fff;
      box-shadow: 0 2px 8px rgba(199, 91, 57, 0.25);
    }

    .btn-terracotta:hover {
      box-shadow: 0 4px 16px rgba(199, 91, 57, 0.35);
    }

    .history {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--line);
    }

    .history-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }

    .history-item {
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0.2rem 0;
    }

    .history-item .label {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--olive);
      background: rgba(107, 124, 78, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.4rem;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 2px solid var(--line);
      font-family: "Lora", serif;
      font-style: italic;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.7rem; }
      .stamp { width: 70px; height: 70px; line-height: 70px; font-size: 0.55rem; }
      .client { padding: 1.25rem; }
      .client-header { flex-direction: column; gap: 0.5rem; }
      .countdown { font-size: 2rem; }
      .login-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div class="login-gate" id="loginGate">
    <div class="login-card">
      <div class="lock-icon">🔒</div>
      <div class="stamp">Albufeira<br>Coworking</div>
      <h2>Private Access</h2>
      <p class="subtitle">Enter your credentials to continue</p>
      <input type="email" class="login-input" id="emailInput" placeholder="Email" autofocus>
      <input type="password" class="login-input" id="passInput" placeholder="Passcode" style="margin-top: 0.75rem;">
      <button class="login-btn" id="loginBtn">Unlock</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- DASHBOARD (hidden until unlocked) -->
  <div class="dashboard" id="dashboard">
    <div class="container">
      <header>
        <div class="stamp">Albufeira<br>Coworking</div>
        <h1>Payment <em>Reminders</em></h1>
        <p class="tagline">Virtual office quarterly renewals</p>
      </header>

      <div class="top-bar">
        <div class="date-today" id="today"></div>
        <button class="btn-lock" id="lockBtn">🔒 Lock</button>
      </div>

      <div class="alert-box" id="alertBanner">
        <h2>Heads up</h2>
        <p id="alertText"></p>
      </div>

      <div class="clients" id="clients"></div>

        <footer>
        <p style="margin-bottom:.5rem">Crafted with care in Albufeira, Portugal</p>
        <a href="privacy.html" style="color:var(--terracotta);font-size:.78rem">Privacy Policy</a>
      </footer>
    </div>
  </div>

  <script>
    const PASSCODE = "Technigo2020!";
    const LOGIN_EMAIL = "hello@albufeiracoworking.com";
    const YOUR_EMAIL = "hello@albufeiracoworking.com";
    const REMIND_DAYS = 2;
    const STORAGE_KEY = "ac_reminders_unlocked";
    const STORAGE_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

    const clients = [
      {
        name: "Pedro Taboada",
        start: "2026-01-03",
        history: [
          { quarter: "2T", sent: "2026-04-03" },
          { quarter: "3T", sent: "2026-06-03" }
        ]
      },
      {
        name: "Marky",
        start: "2026-03-10",
        history: [
          { quarter: "2T", sent: "2026-06-10" }
        ]
      }
    ];

    // ── Auth ──
    function isUnlocked() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return data && (Date.now() - data.ts) < STORAGE_TTL;
      } catch { return false; }
    }

    function unlock() {
      const email = document.getElementById("emailInput");
      const pass = document.getElementById("passInput");
      const error = document.getElementById("loginError");

      if (email.value.trim().toLowerCase() === LOGIN_EMAIL && pass.value === PASSCODE) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ts: Date.now() }));
        document.getElementById("loginGate").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        render();
      } else {
        pass.classList.add("error");
        email.classList.add("error");
        error.textContent = "Invalid email or passcode. Try again.";
        email.value = "";
        pass.value = "";
        email.focus();
        setTimeout(() => { pass.classList.remove("error"); email.classList.remove("error"); }, 400);
      }
    }

    function lock() {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginGate").style.display = "flex";
      document.getElementById("emailInput").value = "";
      document.getElementById("passInput").value = "";
      document.getElementById("loginError").textContent = "";
      document.getElementById("emailInput").focus();
    }

    document.getElementById("loginBtn").addEventListener("click", unlock);
    document.getElementById("passInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });
    document.getElementById("emailInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("passInput").focus();
    });
    document.getElementById("lockBtn").addEventListener("click", lock);

    // Auto-unlock if session valid
    if (isUnlocked()) {
      document.getElementById("loginGate").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      render();
    }

    // ── Dashboard Logic ──
    function getNextRenewal(startStr) {
      const start = new Date(startStr + "T00:00:00");
      const now = new Date();
      let next = new Date(start);
      while (next <= now) next.setMonth(next.getMonth() + 3);
      return next;
    }

    function daysUntil(date) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      return Math.ceil((date - now) / 86400000);
    }

    function fmtDate(d) {
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    }

    function quarterLabel(start, renewal) {
      const q = Math.ceil((renewal.getMonth() + 1) / 3);
      return q + "T";
    }

    function buildMailto(client, renewDate) {
      const q = quarterLabel(client.start, renewDate);
      const subject = encodeURIComponent(`⏰ Reminder: Invoice ${client.name} — ${q}`);
      const body = encodeURIComponent(
        `REMINDER — ${client.name}\n` +
        `Renewal date: ${fmtDate(renewDate)}\n\n` +
        `TODO:\n` +
        `1. Create invoice for ${client.name} (${q})\n` +
        `2. Send invoice to client\n` +
        `3. Wait for payment\n` +
        `4. Send receipt`
      );
      return `mailto:${YOUR_EMAIL}?subject=${subject}&body=${body}`;
    }

    function render() {
      const now = new Date();
      document.getElementById("today").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      let hasAlert = false;
      const alertNames = [];
      const container = document.getElementById("clients");
      container.innerHTML = "";

      clients.forEach(client => {
        const nextRenewal = getNextRenewal(client.start);
        const days = daysUntil(nextRenewal);
        const needsAction = days <= REMIND_DAYS;

        if (needsAction) {
          hasAlert = true;
          alertNames.push(`${client.name} (${days <= 0 ? "today" : days + " days"})`);
        }

        let status = "ok", badgeClass = "badge-ok", badgeText = "On track";
        if (days <= 0) { status = "urgent"; badgeClass = "badge-urgent"; badgeText = "Due today"; }
        else if (days <= REMIND_DAYS) { status = "urgent"; badgeClass = "badge-urgent"; badgeText = "Action needed"; }
        else if (days <= 14) { status = "soon"; badgeClass = "badge-soon"; badgeText = "Coming up"; }

        let countdownDisplay;
        if (days <= 0) countdownDisplay = "Today";
        else if (days === 1) countdownDisplay = "Tomorrow";
        else countdownDisplay = days;

        const historyHTML = client.history.map(h =>
          `<div class="history-item"><span class="label">${h.quarter}</span> sent ${h.sent}</div>`
        ).join("");

        const card = document.createElement("div");
        card.className = `client ${status}`;
        card.innerHTML = `
          <div class="client-header">
            <div>
              <div class="client-name">${client.name}</div>
              <div class="client-since">Client since ${client.start}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="countdown ${status}">${countdownDisplay}</div>
          <div class="countdown-label">${days <= 0 ? "Payment is due" : days === 1 ? "day until renewal" : "days until renewal"}</div>
          <div class="renewal-date">Next renewal: <strong>${fmtDate(nextRenewal)}</strong></div>
          <a class="btn btn-terracotta" href="${buildMailto(client, nextRenewal)}">📧 Remind Me</a>
          <div class="history">
            <div class="history-title">Payments sent</div>
            ${historyHTML}
          </div>
        `;
        container.appendChild(card);
      });

      const banner = document.getElementById("alertBanner");
      if (hasAlert) {
        banner.classList.add("show");
        document.getElementById("alertText").textContent = `Payments due: ${alertNames.join(", ")}`;
      } else {
        banner.classList.remove("show");
      }
    }

    setInterval(render, 60000);
  </script>
</body>
</html>
